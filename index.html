<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Are You Special?</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            height: 100vh;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            /* BLUE STARTING THEME */

            background: linear-gradient(
                135deg,
                #e5f4ff,
                #cce9ff
            );

            font-family: 'Fredoka', sans-serif;

            transition:
                background 0.8s ease;

        }


        .container {

            text-align: center;

            position: relative;

            z-index: 2;

        }


        h1 {

            font-size: clamp(40px, 7vw, 75px);

            color: #4aa8ff;

            margin-bottom: 35px;

            text-shadow:
                3px 3px 0px white;

            animation:
                float 2.5s ease-in-out infinite;

            transition:
                color 0.8s ease;

        }


        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

        }


        button {

            border: none;

            padding: 16px 35px;

            border-radius: 50px;

            font-family: 'Fredoka', sans-serif;

            font-size: 22px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                background 0.8s ease,
                color 0.8s ease,
                box-shadow 0.8s ease;

        }


        /* =========================
           BLUE YES BUTTON
           ========================= */

        #yes {

            background: #69bfff;

            color: white;

            box-shadow:
                0 8px 0 #3c9de8;

        }


        /* =========================
           BLUE NO BUTTON
           ========================= */

        #no {

            background: white;

            color: #4aa8ff;

            box-shadow:
                0 8px 0 #a8d9ff;

        }


        button:hover {

            transform:
                translateY(-4px)
                scale(1.05);

        }


        button:active {

            transform:
                translateY(3px);

            box-shadow: none;

        }


        /* =========================
           PINK THEME
           ========================= */

        body.pink-theme {

            background: linear-gradient(
                135deg,
                #fff0f7,
                #e9f5ff
            );

        }


        body.pink-theme h1 {

            color: #ff70a6;

        }


        body.pink-theme #yes {

            background: #ff8fbd;

            box-shadow:
                0 8px 0 #e86699;

        }


        body.pink-theme #no {

            color: #ff70a6;

            box-shadow:
                0 8px 0 #ffc2d9;

        }


        /* =========================
           VERY YES
           ========================= */

        .very-yes {

            background: #ff4f81 !important;

            color: white !important;

            box-shadow:
                0 10px 0 #d93668 !important;

            transition:
                transform 0.3s ease;

        }


        /* =========================
           PARTICLES
           ========================= */

        .particle {

            position: fixed;

            pointer-events: none;

            font-size: 25px;

            z-index: 10;

            animation:
                explode 1s ease-out forwards;

        }


        @keyframes explode {

            0% {

                transform:
                    translate(0, 0)
                    scale(0.3)
                    rotate(0deg);

                opacity: 1;

            }


            100% {

                transform:
                    translate(var(--x), var(--y))
                    scale(1.4)
                    rotate(var(--rotation));

                opacity: 0;

            }

        }


        /* =========================
           TITLE FLOAT
           ========================= */

        @keyframes float {

            0%, 100% {

                transform:
                    translateY(0);

            }


            50% {

                transform:
                    translateY(-8px);

            }

        }


        /* =========================
           RED PULSE
           ========================= */

        .red-pulse {

            animation:
                redPulse 0.7s ease;

        }


        @keyframes redPulse {

            0% {

                background:
                    #e5f4ff;

            }


            30% {

                background:
                    #ff6b6b;

            }


            60% {

                background:
                    #ffb3b3;

            }


            100% {

                background:
                    linear-gradient(
                        135deg,
                        #fff0f7,
                        #e9f5ff
                    );

            }

        }

    </style>
</head>


<body>


    <div class="container">

        <h1>
            Are you Special?
        </h1>


        <div class="buttons">

            <button id="yes">
                Yes
            </button>


            <button id="no">
                No
            </button>

        </div>

    </div>


    <script>


        const yesButton =
            document.getElementById("yes");


        const noButton =
            document.getElementById("no");


        let veryYesScale = 1.3;



        /* =========================
           YES
           ========================= */

        yesButton.addEventListener(
            "click",
            function(event) {

                createExplosion(

                    event.clientX,
                    event.clientY,

                    [
                        "⭐",
                        "✨",
                        "🌟",
                        "💫"
                    ]

                );

            }
        );



        /* =========================
           NO / VERY YES
           ========================= */

        noButton.addEventListener(
            "click",
            function(event) {


                /* FIRST NO CLICK */

                if (
                    !noButton.classList
                        .contains("very-yes")
                ) {


                    /* Turn pink */

                    document.body
                        .classList
                        .add("pink-theme");


                    /* Red pulse */

                    document.body
                        .classList
                        .remove("red-pulse");


                    void document.body.offsetWidth;


                    document.body
                        .classList
                        .add("red-pulse");


                    /* Change button */

                    noButton.textContent =
                        "VERY YES!";


                    noButton.classList
                        .add("very-yes");


                    return;

                }



                /* =========================
                   EVERY VERY YES CLICK
                   ========================= */


                veryYesScale += 0.25;


                noButton.style.transform =
                    `scale(${veryYesScale})`;



                /* Hearts + stars */

                createExplosion(

                    event.clientX,
                    event.clientY,

                    [
                        "⭐",
                        "✨",
                        "🌟",
                        "💫",
                        "💖",
                        "💕",
                        "❤️"
                    ]

                );

            }
        );



        /* =========================
           EXPLOSION
           ========================= */

        function createExplosion(
            x,
            y,
            symbols
        ) {


            const amount = 18;



            for (
                let i = 0;
                i < amount;
                i++
            ) {


                const particle =
                    document.createElement("div");


                particle.classList
                    .add("particle");


                particle.textContent =
                    symbols[
                        Math.floor(
                            Math.random()
                            * symbols.length
                        )
                    ];



                particle.style.left =
                    x + "px";


                particle.style.top =
                    y + "px";



                const angle =
                    Math.random()
                    * Math.PI
                    * 2;


                const distance =
                    80
                    + Math.random()
                    * 180;



                const moveX =
                    Math.cos(angle)
                    * distance;


                const moveY =
                    Math.sin(angle)
                    * distance;



                particle.style.setProperty(
                    "--x",
                    moveX + "px"
                );


                particle.style.setProperty(
                    "--y",
                    moveY + "px"
                );



                particle.style.setProperty(
                    "--rotation",
                    (
                        Math.random()
                        * 720
                        - 360
                    ) + "deg"
                );



                particle.style.fontSize =
                    (
                        18
                        + Math.random()
                        * 25
                    ) + "px";



                document.body
                    .appendChild(particle);



                setTimeout(
                    function() {

                        particle.remove();

                    },
                    1000
                );

            }

        }

    </script>

</body>
</html>
